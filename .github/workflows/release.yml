name: Build & Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build release APK (v1.1.0)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Android platform 34
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          if [ ! -d "$ANDROID_HOME/platforms/android-34" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME" -name sdkmanager -type f 2>/dev/null | head -1)"
            echo "Using sdkmanager: $SDKMANAGER"
            yes | "$SDKMANAGER" --licenses > /dev/null || true
            "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"
          fi

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Name the APK
        run: |
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk ../dist/subscription-tracker-v1.1.0.apk
          ls -la ../dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: subscription-tracker-v1.1.0
          path: dist/subscription-tracker-v1.1.0.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd ..
          if gh release view v1.1.0 > /dev/null 2>&1; then
            gh release upload v1.1.0 dist/subscription-tracker-v1.1.0.apk --clobber
          else
            gh release create v1.1.0 dist/subscription-tracker-v1.1.0.apk \
              --target "$GITHUB_SHA" \
              --title "Subscription Tracker v1.1.0" \
              --notes "Subscription Tracker v1.1.0. Reminders are fixed and made reliable: Settings now shows your real notification status and takes you to the right system setting when notifications are off, each reminder is scheduled for exactly 9 AM, and reminders re-arm themselves after a restart or an app update. The bottom bar is evenly aligned, the app has its new charcoal ST icon, and Settings is simpler now that backup export/import and the About section are gone. All data stays saved on your phone only. Download subscription-tracker-v1.1.0.apk and install it on Android 8.0 or newer."
          fi
