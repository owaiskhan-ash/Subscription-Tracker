name: Build & Release APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build release APK (v1.0.0)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licences & install platform
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Name the APK
        run: |
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk ../dist/subscription-tracker-v1.0.0.apk
          ls -la ../dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: subscription-tracker-v1.0.0
          path: dist/subscription-tracker-v1.0.0.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd ..
          if gh release view v1.0.0 > /dev/null 2>&1; then
            gh release upload v1.0.0 dist/subscription-tracker-v1.0.0.apk --clobber
          else
            gh release create v1.0.0 dist/subscription-tracker-v1.0.0.apk \
              --target "$GITHUB_SHA" \
              --title "Subscription Tracker v1.0.0" \
              --notes "First release. A calm, clutter-free place for every recurring expense — add subscriptions and regular bills, see what each month really costs, and get one gentle reminder before anything renews. Download subscription-tracker-v1.0.0.apk and install it on Android 8.0 or newer. Everything stays on your phone: no account, no tracking."
          fi
