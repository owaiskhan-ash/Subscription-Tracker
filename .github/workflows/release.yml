name: Build & Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build release APK (v1.2.0)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Android platform 34
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          if [ ! -d "$ANDROID_HOME/platforms/android-34" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME" -name sdkmanager -type f 2>/dev/null | head -1)"
            echo "Using sdkmanager: $SDKMANAGER"
            yes | "$SDKMANAGER" --licenses > /dev/null || true
            "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"
          fi

      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Name the APK
        run: |
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk ../dist/subscription-tracker-v1.2.0.apk
          ls -la ../dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: subscription-tracker-v1.2.0
          path: dist/subscription-tracker-v1.2.0.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd ..
          if gh release view v1.2.0 > /dev/null 2>&1; then
            gh release upload v1.2.0 dist/subscription-tracker-v1.2.0.apk --clobber
          else
            gh release create v1.2.0 dist/subscription-tracker-v1.2.0.apk \
              --target "$GITHUB_SHA" \
              --title "Subscription Tracker v1.2.0" \
              --notes "Subscription Tracker v1.2.0 brings the new JUST APPS tactile design language and handcrafted ST. app icon. Cards across Today, All, and Settings are crafted in hushed brushed-suede and pressed wool-felt tones drawn from the new layered leather-and-suede ST. icon, paired with warm champagne-ivory editorial typography, fine perimeter saddle stitching, and smooth dot-free header and bottom dock bars. All existing subscriptions and 9 AM reminders stay privately stored on your phone. Download subscription-tracker-v1.2.0.apk and install on Android 8.0 or newer."
          fi
